
name: Build NOVYX TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract Android app
        shell: bash
        run: |
          set -eux
          test -f app.zip
          echo "ZIP contents:"
          unzip -l app.zip | head -60

          rm -rf app
          unzip -o app.zip

          echo "Extracted app directory:"
          ls -la app
          test -d app
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Verify project configuration
        shell: bash
        run: |
          set -eux
          cat settings.gradle.kts
          test -d app
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Build NOVYX TV APK
        shell: bash
        run: |
          set -eux
          ls -la app
          gradle assembleDebug --no-daemon --no-configuration-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVYX-TV-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
