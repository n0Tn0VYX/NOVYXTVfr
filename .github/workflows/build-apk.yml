
name: Build NOVYX TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract Android app
        run: |
          set -eux
          test -f app.zip
          unzip -o app.zip
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Fix project permissions
        run: |
          chmod -R u+rwX app

          if [ -d gradle ]; then
            chmod -R u+rwX gradle
          fi

          if [ -f gradlew ]; then
            chmod u+rw gradlew
          fi

          ls -ld app app/src app/src/main

      - name: Show project configuration
        run: |
          echo "----- settings.gradle.kts -----"
          cat settings.gradle.kts
          echo "----- app/build.gradle.kts -----"
          cat app/build.gradle.kts

      - name: Build NOVYX TV APK
        run: |
          gradle assembleDebug --no-daemon --no-configuration-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVYX-TV-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
